<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matches & Results</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .matches-wrap{max-width:1000px;margin:28px auto;padding:20px}
    .matches-card{background:var(--card);padding:18px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.06)}
    .matches-grid{display:grid;grid-template-columns:1fr 360px;gap:18px}
    @media(max-width:900px){.matches-grid{grid-template-columns:1fr}}
    .match-form input,.match-form select{width:100%;padding:8px;border:1px solid #e6edf3;border-radius:8px;margin-bottom:8px}
    .match-list{margin-top:8px}
    .match-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;border:1px solid #eef3f8;margin-bottom:8px;background:#fff}
    .match-meta{font-size:13px;color:var(--muted)}
    .match-actions{display:flex;gap:8px}
    .small{padding:6px 8px;font-size:13px}
    .result-inputs{display:flex;gap:8px;align-items:center}
    .result-inputs input{width:72px}
    .status-msg{display:none;margin-bottom:10px;padding:8px 10px;border-radius:8px;background:#fef3f2;color:#b42318;font-size:13px}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'" />
      </div>
      <div class="brand-title">Matches</div>
    </div>
    <div class="header-right">
      <button id="rudarBtn" class="btn secondary" style="display:none">Set Rudar badge</button>
      <input id="rudarUpload" type="file" accept="image/*" style="display:none" />
      <a href="index.html" class="btn secondary">Back</a>
    </div>
  </header>

  <main class="matches-wrap">
    <div class="matches-card">
      <div id="statusMsg" class="status-msg"></div>

      <div class="tabs">
        <button id="tabUpcoming" class="tab-btn active">Upcoming Matches</button>
        <button id="tabResultsBtn" class="tab-btn">Results</button>
      </div>

      <div id="panelUpcoming" class="tab-panel">
        <div class="matches-grid">
          <div>
            <h3>Add Upcoming Match</h3>
            <form id="matchForm" class="match-form">
              <label>Opponent</label>
              <select id="opponentSelect"></select>
              <div id="newTeam" style="display:none;margin-top:6px">
                <input id="newOpponent" placeholder="New team name" />
                <label style="font-size:12px;margin-top:6px">Upload badge (optional)</label>
                <input id="newBadge" type="file" accept="image/*" />
              </div>
              <label>Date & Time</label>
              <input id="datetime" type="datetime-local" required />
              <label>Location</label>
              <select id="location"><option value="home">Home</option><option value="away">Away</option></select>
              <label>Competition / Notes</label>
              <input id="competition" placeholder="e.g., League, Friendly" />
              <label>Generation</label>
              <select id="generation">
                <option value="2010">2010</option>
                <option value="2012">2012</option>
                <option value="2014">2014</option>
                <option value="Mini Rukomet">Mini Rukomet</option>
              </select>
              <div style="display:flex;gap:8px">
                <button class="btn" type="submit">Add Match</button>
                <button id="clearMatches" type="button" class="btn secondary">Clear Form</button>
              </div>
            </form>

            <h3 style="margin-top:18px">Upcoming</h3>
            <div id="upcomingList" class="match-list"></div>
          </div>
        </div>
      </div>

      <div id="panelResults" class="tab-panel" style="display:none">
        <h3>Results</h3>
        <div id="resultsList" class="match-list"></div>
      </div>
    </div>
  </main>

  <script>
    // Same backend address as script.js. If you ever serve the HTML pages from the
    // SAME Render service as the Flask API, you can change this to '/api'.
    const API_BASE = 'https://orkrudarbanovici-1.onrender.com/api';

    const SESSION_USER_KEY = 'club_session_user';
    const clubName = 'ORK Rudar Banovići';

    const matchForm = document.getElementById('matchForm');
    const dateEl = document.getElementById('datetime');
    const locationEl = document.getElementById('location');
    const compEl = document.getElementById('competition');
    const upcomingList = document.getElementById('upcomingList');
    const resultsList = document.getElementById('resultsList');
    const clearMatches = document.getElementById('clearMatches');
    const statusMsg = document.getElementById('statusMsg');
    const rudarBtn = document.getElementById('rudarBtn');
    const rudarUpload = document.getElementById('rudarUpload');

    // ---------- helpers ----------

    // script.js stores the login in sessionStorage, so read that first.
    function currentUser() {
      try {
        return (sessionStorage.getItem(SESSION_USER_KEY) || localStorage.getItem(SESSION_USER_KEY) || '').trim();
      } catch (e) {
        return '';
      }
    }

    function isAdminUser() {
      return currentUser().toLowerCase() === 'admin';
    }

    function readLocal(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function writeLocal(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showStatus(message) {
      if (!message) {
        statusMsg.style.display = 'none';
        statusMsg.textContent = '';
        return;
      }
      statusMsg.textContent = message;
      statusMsg.style.display = 'block';
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-Club-User': currentUser(),
          ...(options.headers || {})
        }
      });
      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || ('Request failed: ' + response.status));
      }
      return response.json();
    }

    function defaultClubBadge() {
      const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#0a3923'/><circle cx='50' cy='50' r='40' fill='#1fb44a'/><text x='50' y='60' font-size='40' text-anchor='middle' fill='#fff' font-family='Arial'>R</text></svg>";
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // ---------- server calls ----------

    async function loadMatches() {
      try {
        const data = await fetchJson(API_BASE + '/matches');
        const list = Array.isArray(data) ? data : [];
        writeLocal('matches', list); // read-only cache for when the server is unreachable
        showStatus('');
        return list;
      } catch (err) {
        showStatus('Could not reach the server — showing the last saved data. (' + err.message + ')');
        return readLocal('matches', []);
      }
    }

    async function loadTeams() {
      try {
        const data = await fetchJson(API_BASE + '/teams');
        const teams = data && typeof data === 'object' ? data : {};
        writeLocal('teams', teams);
        return teams;
      } catch (err) {
        return readLocal('teams', {});
      }
    }

    // Saves ONE match (insert or update). Never overwrites the whole list.
    async function upsertMatch(match) {
      if (!isAdminUser()) return false;
      try {
        await fetchJson(API_BASE + '/matches', { method: 'POST', body: JSON.stringify(match) });
        return true;
      } catch (err) {
        alert('Could not save the match: ' + err.message);
        return false;
      }
    }

    async function deleteMatchById(id) {
      if (!isAdminUser()) return false;
      try {
        await fetchJson(API_BASE + '/matches/' + encodeURIComponent(id), { method: 'DELETE' });
        return true;
      } catch (err) {
        alert('Could not delete the match: ' + err.message);
        return false;
      }
    }

    // Saves ONE team badge.
    async function saveTeam(name, badge) {
      if (!isAdminUser()) return false;
      try {
        await fetchJson(API_BASE + '/teams', { method: 'POST', body: JSON.stringify({ [name]: badge }) });
        return true;
      } catch (err) {
        alert('Could not save the team badge: ' + err.message);
        return false;
      }
    }

    // ---------- rendering ----------

    function badgeTag(data) {
      return data ? `<img src="${esc(data)}" class="team-badge" alt="badge"/>` : '';
    }

    async function render() {
      const admin = isAdminUser();
      matchForm.style.display = admin ? '' : 'none';
      rudarBtn.style.display = admin ? '' : 'none';

      const [items, loadedTeams] = await Promise.all([loadMatches(), loadTeams()]);
      const teamMap = { ...loadedTeams };
      if (!teamMap[clubName]) teamMap[clubName] = defaultClubBadge();

      upcomingList.innerHTML = '';
      resultsList.innerHTML = '';
      items.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

      items.forEach(it => {
        const el = document.createElement('div');
        el.className = 'match-item';
        const left = document.createElement('div');
        const homeName = it.location === 'home' ? clubName : it.opponent;
        const awayName = it.location === 'home' ? it.opponent : clubName;
        const homeBadge = teamMap[homeName] || null;
        const awayBadge = teamMap[awayName] || null;
        const when = new Date(it.datetime).toLocaleString();
        const extra = (it.competition ? ' • ' + esc(it.competition) : '') + (it.generation ? ' • ' + esc(it.generation) : '');

        if (it.played) {
          left.innerHTML = `<div><strong>${badgeTag(homeBadge)} ${esc(homeName)} ${esc(it.homeScore)} - ${esc(it.awayScore)} ${esc(awayName)} ${badgeTag(awayBadge)}</strong></div><div class="match-meta">${esc(when)}${extra}</div>`;
        } else {
          left.innerHTML = `<div><strong>${badgeTag(homeBadge)} ${esc(homeName)} vs ${esc(awayName)} ${badgeTag(awayBadge)}</strong> <div class="match-meta">${esc(when)}</div></div><div class="match-meta">${it.location === 'home' ? 'Home' : 'Away'}${extra}</div>`;
        }

        const actions = document.createElement('div');
        actions.className = 'match-actions';

        if (it.played) {
          const score = document.createElement('div');
          score.innerHTML = `<strong>${esc(it.homeScore)} - ${esc(it.awayScore)}</strong>`;
          actions.appendChild(score);
        } else if (admin) {
          const playBtn = document.createElement('button');
          playBtn.className = 'small';
          playBtn.textContent = 'Enter Result';
          playBtn.addEventListener('click', () => showResultInputs(el, it));
          actions.appendChild(playBtn);
        }

        if (admin) {
          const del = document.createElement('button');
          del.className = 'small';
          del.textContent = 'Delete';
          del.addEventListener('click', async () => {
            if (!confirm('Delete this match?')) return;
            if (await deleteMatchById(it.id)) render();
          });
          actions.appendChild(del);
        }

        el.appendChild(left);
        el.appendChild(actions);
        (it.played ? resultsList : upcomingList).appendChild(el);
      });

      if (upcomingList.children.length === 0) upcomingList.innerHTML = '<div class="match-meta">No upcoming matches.</div>';
      if (resultsList.children.length === 0) resultsList.innerHTML = '<div class="match-meta">No results yet.</div>';
    }

    function showResultInputs(container, match) {
      const actions = container.querySelector('.match-actions');
      actions.innerHTML = '';
      const inputs = document.createElement('div');
      inputs.className = 'result-inputs';
      const homeName = match.location === 'home' ? clubName : match.opponent;
      const awayName = match.location === 'home' ? match.opponent : clubName;

      const homeInput = document.createElement('input');
      homeInput.type = 'number';
      homeInput.min = 0;
      homeInput.placeholder = homeName;
      const awayInput = document.createElement('input');
      awayInput.type = 'number';
      awayInput.min = 0;
      awayInput.placeholder = awayName;
      const save = document.createElement('button');
      save.className = 'small';
      save.textContent = 'Save';
      const cancel = document.createElement('button');
      cancel.className = 'small';
      cancel.textContent = 'Cancel';

      inputs.appendChild(homeInput);
      inputs.appendChild(document.createTextNode('-'));
      inputs.appendChild(awayInput);
      inputs.appendChild(save);
      inputs.appendChild(cancel);
      actions.appendChild(inputs);

      save.addEventListener('click', async () => {
        const homeScore = parseInt(homeInput.value, 10);
        const awayScore = parseInt(awayInput.value, 10);
        if (Number.isNaN(homeScore) || Number.isNaN(awayScore)) return alert('Enter both scores');
        if (await upsertMatch({ ...match, played: true, homeScore, awayScore })) render();
      });

      cancel.addEventListener('click', render);
    }

    // ---------- opponent dropdown ----------

    async function populateOpponentSelect() {
      const sel = document.getElementById('opponentSelect');
      const teams = await loadTeams();
      sel.innerHTML = '';

      const optChoose = document.createElement('option');
      optChoose.value = '';
      optChoose.textContent = 'Select existing team...';
      sel.appendChild(optChoose);

      Object.keys(teams).filter(name => name !== clubName).forEach(name => {
        const o = document.createElement('option');
        o.value = name;
        o.textContent = name;
        sel.appendChild(o);
      });

      const oNew = document.createElement('option');
      oNew.value = '__new';
      oNew.textContent = 'Add new team...';
      sel.appendChild(oNew);
    }

    document.getElementById('opponentSelect').addEventListener('change', () => {
      const v = document.getElementById('opponentSelect').value;
      document.getElementById('newTeam').style.display = v === '__new' ? 'block' : 'none';
    });

    // ---------- Rudar badge (admin) ----------

    if (rudarBtn && rudarUpload) {
      rudarBtn.addEventListener('click', () => rudarUpload.click());
      rudarUpload.addEventListener('change', () => {
        const file = rudarUpload.files[0];
        if (!file) return;
        const fr = new FileReader();
        fr.onload = async () => {
          if (await saveTeam(clubName, fr.result)) {
            alert('Rudar badge saved.');
            render();
          }
        };
        fr.readAsDataURL(file);
      });
    }

    // ---------- add match ----------

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(file);
      });
    }

    matchForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (!isAdminUser()) return;

      const sel = document.getElementById('opponentSelect');
      let opponent = sel.value;
      const datetime = dateEl.value;
      const location = locationEl.value;
      const competition = compEl.value.trim();
      const generation = document.getElementById('generation').value;
      if (!datetime) return alert('Date/time required');

      if (opponent === '__new' || opponent === '') {
        const newName = document.getElementById('newOpponent').value.trim();
        if (!newName) return alert('Enter new team name');
        const badgeFile = document.getElementById('newBadge').files[0];
        let badgeData = '';
        if (badgeFile) {
          try { badgeData = await readFileAsDataUrl(badgeFile); } catch (err) { badgeData = ''; }
        }
        // Save the team (name + optional badge) so it shows up in the dropdown next time
        if (!(await saveTeam(newName, badgeData))) return;
        opponent = newName;
      }

      const match = {
        id: 'm_' + Date.now(),
        opponent,
        datetime,
        location,
        competition,
        generation,
        played: false
      };

      if (await upsertMatch(match)) {
        matchForm.reset();
        document.getElementById('newTeam').style.display = 'none';
        await populateOpponentSelect();
        render();
      }
    });

    clearMatches.addEventListener('click', () => {
      matchForm.reset();
      document.getElementById('newTeam').style.display = 'none';
    });

    // ---------- tabs ----------

    const tabUpcoming = document.getElementById('tabUpcoming');
    const tabResultsBtn = document.getElementById('tabResultsBtn');
    const panelUpcoming = document.getElementById('panelUpcoming');
    const panelResults = document.getElementById('panelResults');

    function showPanel(panel) {
      if (panel === 'upcoming') {
        panelUpcoming.style.display = 'block'; panelResults.style.display = 'none';
        tabUpcoming.classList.add('active'); tabResultsBtn.classList.remove('active');
      } else {
        panelUpcoming.style.display = 'none'; panelResults.style.display = 'block';
        tabUpcoming.classList.remove('active'); tabResultsBtn.classList.add('active');
      }
    }

    tabUpcoming.addEventListener('click', () => showPanel('upcoming'));
    tabResultsBtn.addEventListener('click', () => showPanel('results'));

    // ---------- start ----------

    populateOpponentSelect();
    render();
  </script>
</body>
</html>
